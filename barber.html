/* ---------- what each tool does where the finger touches ---------- */
const local=p=>charG.worldToLocal(p.clone());
const d3=(t,k,p)=>Math.hypot(t.x-p.x,vy(t,k)-p.y,t.z-p.z);
let snipN=0;
function cutAt(p,R,toLen){let n=0;STR.forEach(t=>{const L=st.len[t.n];if(!L)return;let k0=-1;
  for(let k=0;k<L;k++)if(d3(t,k,p)<R){k0=k;break}
  if(k0<0)return;const nl=toLen===undefined?k0:Math.min(L,t.t==='beard'?0:toLen);if(nl>=L)return;
  for(let k=nl;k<L;k++){if(n<70){const key=t.n+'_'+k;spawnBit(charG.localToWorld(V.set(t.x,vy(t,k),t.z)).clone(),st.col[key]||P.hc)}n++;delete st.col[t.n+'_'+k]}
  st.len[t.n]=nl});
 if(n){rebuild();if(toLen===undefined&&++snipN%2)sfx.snip();react('cut')}return n}
function growAt(p,R){let n=0;STR.forEach(t=>{const L=st.len[t.n];if(L>=t.max)return;if(d3(t,L,p)<R||d3(t,0,p)<R*.8){st.len[t.n]=L+1;if(color&&tool==='grow'&&st.col[t.n+'_'+(L-1)])st.col[t.n+'_'+L]=st.col[t.n+'_'+(L-1)];n++}});
 if(n){rebuild();sfx.grow();react('grow')}}
function paintAt(p,R){let n=0;STR.forEach(t=>{for(let k=0;k<st.len[t.n];k++)if(d3(t,k,p)<R){const y=vy(t,k);st.col[t.n+'_'+k]=color==='rainbow'?'#'+CL.setHSL(((y*.12+performance.now()/4000)%1+1)%1,.85,.6).getHexString():color;n++}});
 if(n){rebuild();sfx.spray();react('color')}}
function soapAt(p){if(foam.length>=300)foam.splice(0,2);for(let k=0;k<2;k++)foam.push({x:p.x+rnd(-.25,.25),y:p.y+rnd(-.2,.25),z:p.z+rnd(-.25,.25),sc:rnd(.18,.38),age:0});if(Math.random()<.4)sfx.pop();react('soap')}
function rinseAt(p,pw){const before=foam.length;foam=foam.filter(f=>Math.hypot(f.x-p.x,f.y-p.y,f.z-p.z)>.8);
 for(let k=0;k<4;k++)spawnBit(V.set(pw.x+rnd(-.4,.4),pw.y+rnd(.3,1),pw.z+rnd(-.2,.4)).clone(),'#7fd3ff',true);
 if(foam.length<before){drawFoam();if(!foam.length){stars(0,HT,1,16,3);say('So clean! ✨')}}sfx.spray();react('shower')}
function apply(hit){const p=local(hit.point);
 if(tool==='cut')cutAt(p,.3);
 if(tool==='clip')cutAt(p,.5,1);
 if(tool==='grow')growAt(p,.62);
 if(tool==='color')paintAt(p,.38);
 if(tool==='soap')soapAt(p);
 if(tool==='shower')rinseAt(p,hit.point)}

/* ---------- reactions ---------- */
const sayL=label('',undefined,1);sayL.visible=false;sayL.userData.keep=true;let sayT=0,talkT=0,reactT=0;
function say(t){setLabel(sayL,t);sayL.visible=true;sayT=2.2;talkT=.5}
const LINES={cut:['Snip snip! ✂️','Ooh!','Tickles! 😆','Not too short!','Wheee!'],clip:['Bzzzzz! 🪒','Hehe that tickles!'],grow:['Whoa! 😮','My hair is growing!','So long! 🤩','Is that a beard?!'],
 color:['Pretty! 🌈','Ooh, colours!','I look amazing!'],soap:['Bubbles! 🫧','Hehe, bubbly!'],shower:['Splash! 💦','Brrr, wet!']};
function react(k){if(performance.now()<reactT)return;reactT=performance.now()+3500+Math.random()*2500;say(pick(LINES[k==='cut'&&tool==='clip'?'clip':k]))}

/* ---------- photos ---------- */
function photo(){sfx.click();sayL.visible=false;mouthS.visible=true;mouthO.visible=false;
 renderer.render(scene,cam);const url=renderer.domElement.toDataURL('image/jpeg',.85);
 const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
 const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),w=360,h=Math.round(w*img.height/img.width);c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  photos.unshift({u:c.toDataURL('image/jpeg',.7),n:P.n});photos=photos.slice(0,12);try{localStorage.setItem(PKEY,JSON.stringify(photos))}catch(e){photos.pop()}};img.src=url;
 setTimeout(()=>{$('pimg').src=url;$('pcap').textContent=P.n+' ⭐ '+pick(['Looking good!','So cool!','Best haircut ever!','Wow!']);$('photo').hidden=false;sfx.level()},350)}
$('pok').onclick=()=>{$('photo').hidden=true;say('Cheese! 📸')};
$('galb').onclick=()=>{$('gal').innerHTML=photos.map((p,i)=>`<img src="${p.u}" data-i="${i}" alt="${p.n}">`).join('');$('gnone').hidden=photos.length>0;$('gallery').hidden=false;sfx.pop()};
$('gal').onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;$('pimg').src=photos[i].u;$('pcap').textContent=photos[i].n+' ⭐';$('gallery').hidden=true;$('photo').hidden=false};
$('gok').onclick=()=>$('gallery').hidden=true;

/* ---------- choosing a person ---------- */
const longOf=p=>Math.min(70,(p.hair.side|0)*5);
$('people').innerHTML=PEOPLE.map(p=>`<button class="btn pp" data-p="${p.id}"><div class="face" style="--skin:${p.skin};--hair:${p.hc};--eye:${p.eye};--long:${longOf(p)}px">
 <i class="hr"></i>${longOf(p)>20?'<i class="lg" style="left:-8px"></i><i class="lg" style="right:-8px"></i>':''}<i class="ey l"></i><i class="ey r"></i>${p.tash?'<i class="ta"></i>':''}<i class="mo"></i></div>${p.n}</button>`).join('');
let started=false;
function choose(id){P=PEOPLE.find(p=>p.id===id)||PEOPLE[0];G.cur=P.id;st=G.chars[P.id]||defHair(P);if(!st.col)st.col={};
 foam=[];drawFoam();bits.length=0;buildBody();buildHat();rebuild();$('who').textContent=P.n;rotT=0;chairG.rotation.y=-.5;
 $('start').hidden=true;started=true;sfx.ding();setTimeout(()=>say(pick(['Hi! Can I have a haircut?','Make me look cool! 😎','Do something MAD! 🤪','Hello! ✂️'])),300);setTool(tool)}
$('people').onclick=e=>{const b=e.target.closest('[data-p]');if(b)choose(b.dataset.p)};
$('pick').onclick=()=>{$('start').hidden=false;sfx.pop()};
$('snd').onclick=()=>{G.mute=!G.mute;$('snd').textContent=G.mute?'🔇':'🔊';save()};$('snd').textContent=G.mute?'🔇':'🔊';
$('home').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}};

/* ---------- touch: rub the hair with the tool, drag anywhere else to spin the chair ---------- */
let rotT=0;$('tl').onclick=()=>{rotT-=Math.PI/2;sfx.pop()};$('tr').onclick=()=>{rotT+=Math.PI/2;sfx.pop()};
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function hitAt(x,y){const r=renderer.domElement.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);
 const h=ray.intersectObjects([hairIM,foamIM,head],false)[0];if(!h)return null;if(tool==='grow'||tool==='soap'||tool==='shower'||h.object!==head)return h;return h}
let down=null,applyT=0;
const cur=$('cursor');
$('stage').addEventListener('pointerdown',e=>{if(down||!started)return;const h=hitAt(e.clientX,e.clientY);
 if(h&&tool!=='hat'){down={id:e.pointerId,mode:'tool',x:e.clientX,y:e.clientY};apply(h);applyT=0;const t=TOOLS.find(t=>t.id===tool);cur.textContent=t.icon;cur.className=t.cur||'';cur.style.display='block';cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';if(tool==='clip')buzz(true)}
 else down={id:e.pointerId,mode:'turn',x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(!down||e.pointerId!==down.id)return;
 if(down.mode==='turn'){const dx=e.clientX-down.x;rotT+=dx*.012;chairG.rotation.y+=dx*.012;down.x=e.clientX}
 else{down.x=e.clientX;down.y=e.clientY;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'}});
function endDown(e){if(!down||e.pointerId!==down.id)return;down=null;cur.style.display='none';buzz(false)}
addEventListener('pointerup',endDown);addEventListener('pointercancel',endDown);

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);cam.aspect=a;
 if(a<.9){cam.fov=40;CB={x:0,y:7.4,z:18,ly:5}}else{cam.fov=36;CB={x:1.2,y:7.6,z:15.4,ly:5.5}}cam.updateProjectionMatrix();placeCam(1)}
// the camera backs off when the hair (or the hat) gets really tall
let CB={x:0,y:7,z:15,ly:5},camX=0;
function placeCam(k){const top=hatG.position.y+(st&&st.hat!=='none'?2:0),want=Math.max(0,top-8.6);camX+=(want-camX)*k;
 cam.position.set(CB.x,CB.y+camX*.55,CB.z+camX*1.7);cam.lookAt(CB.x,CB.ly+camX*.55,0)}
addEventListener('resize',resize);
let last=performance.now(),blinkT=2;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(down&&down.mode==='tool'){applyT-=dt;if(applyT<=0){applyT=tool==='grow'?.07:.045;const h=hitAt(down.x,down.y);if(h)apply(h)}}
 chairG.rotation.y+=(rotT-chairG.rotation.y)*Math.min(1,dt*8);
 if(started){charG.position.y=Math.sin(now/700)*.025;blinkT-=dt;if(eyes){eyes.scale.y=blinkT<.12?.15:1;if(blinkT<0)blinkT=2+Math.random()*3}
  sayT-=dt;talkT-=dt;if(sayT<=0)sayL.visible=false;sayL.position.set(-3,7.8,1);
  if(mouthO){const o=talkT>0&&Math.sin(now/70)>0;mouthO.visible=o;mouthS.visible=!o}}
 foam.forEach(f=>f.age+=dt);if(foam.length)drawFoam(now);
 stepBits(dt);stepStars(dt);poleT.offset.y-=dt*.25;placeCam(Math.min(1,dt*3));
 renderer.render(scene,cam);requestAnimationFrame(frame)}
for(let k=0;k<14;k++){const t=document.createElement('div');t.style.cssText=`position:absolute;left:${Math.random()*96}vw;top:${Math.random()*92}vh;color:#ffd23f;font-size:${12+Math.random()*22}px;pointer-events:none;text-shadow:0 0 10px #ffd23f;animation:pop 2s ease-in-out ${Math.random()*2}s infinite alternate`;t.textContent='★';$('start').appendChild(t)}
P=PEOPLE.find(p=>p.id===G.cur)||PEOPLE[0];st=G.chars[P.id]||defHair(P);buildBody();buildHat();rebuild();chairG.rotation.y=-.5;rotT=-.5;
resize();
/* engine: re-draw labels once the Fredoka font has loaded */
if(document.fonts)document.fonts.ready.then(()=>LABELS.forEach(l=>{const u=l.userData,t=u.txt;u.txt=null;setLabel(l,t,u.cur)}));
requestAnimationFrame(frame);
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}});
}
</script>
</body>
</html>
