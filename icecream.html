  if(modeT>2.6&&!shift.ended){shift.ended=1;showEnd()}}
 // customers walk up, wait (getting a little grumpy) and walk off with their ice cream
 queue.forEach((c,i)=>{const arrived=walk(c,dt,3);if(arrived){c.arr=true;c.m.rotation.y=Math.PI}
  if(mode==='serve'&&!broken){c.p-=dt/c.T;if(c.p<=0){leave(c,false);sfx.sad();return}}
  c.face.position.set(c.m.position.x,c.m.scale.x<1?1.75:2.25,c.m.position.z);c.face.visible=i>0&&c.arr;setLabel(c.face,faceOf(c.p),'#ffffff')});
 if(queue[0]&&queue[0].arr&&mode==='serve'){renderOrder()}else if(!$('order').hidden){renderOrder()}
 for(let i=leaving.length-1;i>=0;i--){const c=leaving[i];c.hold=!!c.ice;const done=walk(c,dt,3.2);c.face.position.set(c.m.position.x,c.m.scale.x<1?1.75:2.25,c.m.position.z);
  if(done){scene.remove(c.m);killLabel(c.face);leaving.splice(i,1)}}
 for(let i=flying.length-1;i>=0;i--){const f=flying[i];f.t+=dt/.4;const to=new THREE.Vector3(f.c.m.position.x+.25,1.15*f.c.m.scale.x,f.c.m.position.z+.3);
  if(f.t>=1){scene.remove(f.m);flying.splice(i,1);const ice=f.m;f.c.m.add(ice);ice.position.set(.32,.95,.32);ice.scale.setScalar(.8);f.c.ice=ice;f.c.hold=true;continue}
  f.m.position.lerpVectors(f.from,to,f.t);f.m.position.y+=Math.sin(f.t*Math.PI)*.5}
 // the ice cream being made wobbles on the counter
 if(buildMesh){boing=Math.max(0,boing-dt*4);buildMesh.scale.setScalar(1+Math.sin(boing*9)*boing*.12);buildMesh.rotation.y=Math.sin(now/900)*.4}
 if(wheel)wheel.rotation.z+=dt*.25;
 if(snowPts){const a=snowPts.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-dt*(1.5+i%3*.5);if(y<0)y+=12;a.setY(i,y)}a.needsUpdate=true}
 stepStars(dt);hud()}
$('horn').onclick=()=>{sfx.honk();if(mode==='drive'||mode==='map')banner('HONK HONK! 📯',1)};
$('snd').onclick=()=>{G.mute=!G.mute;$('snd').textContent=G.mute?'🔇':'🔊';save()};$('snd').textContent=G.mute?'🔇':'🔊';
$('home').onclick=()=>save();
setPaint();resize();showMap();
/* engine: re-draw labels once the Fredoka font has loaded */
if(document.fonts)document.fonts.ready.then(()=>LABELS.forEach(l=>{const u=l.userData,t=u.txt;u.txt=null;setLabel(l,t,u.cur)}));
requestAnimationFrame(frame);
}
</script>
