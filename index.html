<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaden's Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Kaden's Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a toy-box home screen for a five-year-old: two giant buttons, nothing else to get lost in
   COLOUR/TYPE: sky blue, grass, the hotel's green and Kaden Mart's red; Fredoka */
:root{color-scheme:light;--ink:#3b2a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font:600 18px/1.25 Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;color:#2b2140;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{min-height:100vh;min-height:100dvh;background:linear-gradient(#6ec6ff 0%,#a8e0ff 62%,#7bd35a 62%,#5dbb46 100%);overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.cloud{position:fixed;height:34px;background:#fff;border-radius:6px;box-shadow:24px -18px 0 -4px #fff,-20px -10px 0 -6px #fff;opacity:.9;animation:drift linear infinite;z-index:0}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.tw{position:fixed;color:#ffd23f;pointer-events:none;animation:tw 2.2s ease-in-out infinite;text-shadow:0 0 10px #fff8;z-index:0}
@keyframes tw{50%{opacity:.2;transform:scale(.6) rotate(40deg)}}
h1{position:relative;z-index:1;margin:0 0 6px;text-align:center;font-size:clamp(44px,9vw,84px);line-height:1;color:#ffd23f;letter-spacing:1px;
 text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink),-4px -4px 0 var(--ink),4px -4px 0 var(--ink),-4px 4px 0 var(--ink),0 10px 0 var(--ink);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.sub{position:relative;z-index:1;margin:6px 0 22px;font-size:clamp(18px,3vw,24px);color:#fff;text-shadow:2px 0 0 #2b6fc2,-2px 0 0 #2b6fc2,0 2px 0 #2b6fc2,0 -2px 0 #2b6fc2,0 4px 0 #2b6fc2}
.games{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;width:min(860px,100%)}
.game{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#2b2140;border:5px solid var(--ink);border-radius:30px;padding:20px 18px 18px;
 box-shadow:0 10px 0 var(--ink),0 16px 28px #0003;transition:transform .12s;touch-action:manipulation;position:relative;overflow:hidden}
.game:active{transform:translateY(8px);box-shadow:0 2px 0 var(--ink)}
.game::before{content:"";position:absolute;inset:0 0 auto;height:45%;background:linear-gradient(#ffffff55,#fff0);pointer-events:none}
.hotel{background:linear-gradient(#9be7a3,#4cb050)}
.mart{background:linear-gradient(#ffb3ab,#ff5a4e)}
.pic{font-size:clamp(80px,14vw,120px);line-height:1;filter:drop-shadow(0 6px 0 #0003);animation:wig 3s ease-in-out infinite}
.mart .pic{animation-delay:-1.5s}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
.name{margin-top:10px;font-size:clamp(28px,4.6vw,40px);font-weight:700;color:#fff;text-align:center;line-height:1.05;
 text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),0 6px 0 var(--ink)}
.what{margin:8px 0 12px;font-size:17px;font-weight:600;color:#fff;text-shadow:0 2px 0 #0004;text-align:center}
.lv{background:#fffef6;border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-size:18px;font-weight:700;box-shadow:0 3px 0 #0003}
.play{margin-top:14px;background:linear-gradient(#ffe680,#ffc21a);border:4px solid var(--ink);border-radius:18px;padding:8px 34px;font-size:28px;font-weight:700;box-shadow:0 5px 0 var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<h1>Kaden's Games</h1>
<div class="sub">Which one do you want to play? 👇</div>
<div class="games">
 <a class="game hotel" href="hotel.html">
  <div class="pic">🏨</div>
  <div class="name">Kaden's Kosy Hotel</div>
  <div class="what">Check in guests, clean rooms, build a giant hotel</div>
  <div class="lv" id="hlv">⭐ New game</div>
  <div class="play">Play ▶</div>
 </a>
 <a class="game mart" href="mart.html">
  <div class="pic">🛒</div>
  <div class="name">Kaden Mart</div>
  <div class="what">Fill the shelves, serve customers, collect the trolleys</div>
  <div class="lv" id="mlv">⭐ New game</div>
  <div class="play">Play ▶</div>
 </a>
</div>
<script>
{
const LV=[0,3,8,15,24,35,50,70,95,125,160,200,250,310,380,460,550,650,760,880];
const lv=k=>{try{const s=JSON.parse(localStorage.getItem(k)||'null');return s?LV.filter(t=>(s.served||0)>=t).length:0}catch(e){return 0}};
const h=Math.max(lv('kadenHotel2'),lv('kadenHotel2_beach'),lv('kadenHotel2_snow')),m=lv('kadenMart1');
const hotels=[lv('kadenHotel2_beach')?1:0,lv('kadenHotel2_snow')?1:0].reduce((a,b)=>a+b,1);
if(h)document.getElementById('hlv').textContent=`⭐ Level ${h}`+(hotels>1?` · ${hotels} hotels`:'');
if(m)document.getElementById('mlv').textContent=`⭐ Level ${m}`;
for(let k=0;k<5;k++){const c=document.createElement('div');c.className='cloud';c.style.top=(4+Math.random()*40)+'vh';c.style.width=(70+Math.random()*80)+'px';
 c.style.animationDuration=(40+Math.random()*40)+'s';c.style.animationDelay=(-Math.random()*60)+'s';document.body.appendChild(c)}
for(let k=0;k<14;k++){const t=document.createElement('div');t.className='tw';t.textContent='★';t.style.left=Math.random()*96+'vw';t.style.top=Math.random()*60+'vh';
 t.style.fontSize=(12+Math.random()*22)+'px';t.style.animationDelay=Math.random()*2+'s';document.body.appendChild(t)}
}
</script>
</body>
</html>
